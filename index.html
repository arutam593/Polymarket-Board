<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Board — Polymarket Odds Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14181c; --ink-soft: #1d2329;
    --paper: #f2ede1; --paper-dim: #cfc8b6;
    --field: #3f6b46; --field-bright: #4f8558;
    --loss: #a8452f; --loss-bright: #c25a3f;
    --amber: #b8863a;
    --line: rgba(242,237,225,0.14); --line-strong: rgba(242,237,225,0.28);
  }
  :root:not([data-theme="light"]) {
    --bg: var(--ink); --bg-panel: var(--ink-soft); --text: var(--paper);
    --text-dim: var(--paper-dim); --border: var(--line); --border-strong: var(--line-strong);
    --bar-track: rgba(242,237,225,0.1);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #ece5d3; --bg-panel: #f8f4ea; --text: #1c211f; --text-dim: #5a5548;
      --border: rgba(28,33,31,0.14); --border-strong: rgba(28,33,31,0.28);
      --bar-track: rgba(28,33,31,0.08);
    }
  }
  :root[data-theme="light"] {
    --bg: #ece5d3; --bg-panel: #f8f4ea; --text: #1c211f; --text-dim: #5a5548;
    --border: rgba(28,33,31,0.14); --border-strong: rgba(28,33,31,0.28);
    --bar-track: rgba(28,33,31,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    min-height: 100vh; padding: 32px 20px 80px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  header.masthead {
    border-bottom: 3px solid var(--text); padding-bottom: 18px; margin-bottom: 24px;
    display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px;
  }
  .masthead h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(26px, 5vw, 38px); letter-spacing: -0.01em; margin: 0; }
  .masthead .sub { font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em; }
  .theme-toggle { font-size: 11px; color: var(--text-dim); background: none; border: none; text-decoration: underline; padding: 0; cursor: pointer; }
  .theme-toggle:hover { color: var(--text); }

  .statusbar {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
    font-size: 11.5px; color: var(--text-dim); margin-bottom: 18px; border: 1px solid var(--border); padding: 10px 14px;
  }
  .statusbar .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--field-bright); margin-right: 6px; }
  .statusbar.error .dot { background: var(--loss-bright); }
  button.refresh { font-family: 'IBM Plex Mono', monospace; font-size: 11px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-dim); padding: 5px 10px; cursor: pointer; }
  button.refresh:hover { color: var(--text); border-color: var(--text); }

  .panel { background: var(--bg-panel); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; margin: 0 0 12px; }

  .filterrow { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .chip { font-size: 11px; border: 1px solid var(--border-strong); padding: 6px 12px; cursor: pointer; color: var(--text-dim); background: transparent; }
  .chip.active { border-color: var(--amber); color: var(--amber); }

  .card { border: 1px solid var(--border); padding: 14px 18px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .card .title { font-size: 14px; }
  .card .pick { text-align: right; }
  .card .pick .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; }
  .card .pick .pct { font-size: 12px; color: var(--field-bright); }

  .empty { text-align: center; color: var(--text-dim); font-size: 12.5px; padding: 30px 0; border: 1px dashed var(--border-strong); }

  @media (max-width: 480px) { .outcome { grid-template-columns: 80px 1fr 42px; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>The Board</h1>
      <div class="sub">POLYMARKET SPORTS ODDS VIEWER</div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">switch theme</button>
  </header>

  <div class="statusbar" id="statusBar">
    <span><span class="dot"></span><span id="statusText">Loading games.json...</span></span>
    <button class="refresh" id="refreshBtn" type="button">Refresh</button>
  </div>

  <section class="panel" id="resultsPanel">
    <h2>Today's games</h2>
    <div class="filterrow" id="filterRow"></div>
    <div id="cardsList"></div>
  </section>

</div>

<script>
  const THEME_KEY = 'board_theme_v1';
  let allEvents = [];
  let activeFilter = 'all';

  function loadTheme() {
    try { const t = localStorage.getItem(THEME_KEY); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e) {}
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const isLight = current === 'light' || (!current && window.matchMedia('(prefers-color-scheme: light)').matches);
    const next = isLight ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  }
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  function safeParseArr(val) {
    if (Array.isArray(val)) return val;
    if (typeof val === 'string') { try { const p = JSON.parse(val); return Array.isArray(p) ? p : []; } catch(e) { return []; } }
    return [];
  }
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }
  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function getTagLabels(ev) {
    if (!Array.isArray(ev.tags)) return [];
    return ev.tags.map(t => (typeof t === 'string' ? t : (t.label || t.slug || ''))).filter(Boolean);
  }

  function renderFilters(sportBuckets) {
    const row = document.getElementById('filterRow');
    const names = ['all', ...Object.keys(sportBuckets)];
    row.innerHTML = names.map(name => {
      const label = name === 'all' ? 'All (' + allEvents.length + ')' : name + ' (' + sportBuckets[name].length + ')';
      const cls = 'chip' + (activeFilter === name ? ' active' : '');
      return `<button type="button" class="${cls}" data-bucket="${escapeHtml(name)}">${escapeHtml(label)}</button>`;
    }).join('');
    row.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeFilter = chip.getAttribute('data-bucket');
        render(window.__sportBuckets);
      });
    });
  }

  function renderCards(sportBuckets) {
    const list = document.getElementById('cardsList');
    const filtered = activeFilter === 'all' ? allEvents : (sportBuckets[activeFilter] || []);

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">no games in this category right now</div>';
      return;
    }

    list.innerHTML = filtered.map(ev => {
      const markets = Array.isArray(ev.markets) ? ev.markets : [];
      const market = markets[0];
      if (!market) return '';

      const outcomes = safeParseArr(market.outcomes);
      const prices = safeParseArr(market.outcomePrices).map(p => parseFloat(p));
      if (outcomes.length === 0) return '';

      let bestIdx = 0;
      for (let i = 1; i < prices.length; i++) {
        if (prices[i] > prices[bestIdx]) bestIdx = i;
      }
      const pickName = outcomes[bestIdx];
      const pickPct = isFinite(prices[bestIdx]) ? Math.round(prices[bestIdx] * 1000) / 10 : null;

      return `<div class="card">
          <div class="title">${escapeHtml(ev.title || ev.slug || 'Untitled event')}</div>
          <div class="pick">
            <div class="name">${escapeHtml(pickName)}</div>
            <div class="pct">${pickPct !== null ? pickPct + '% implied' : 'no price data'}</div>
          </div>
        </div>`;
    }).join('');
  }

  function render(sportBuckets) {
    window.__sportBuckets = sportBuckets;
    renderFilters(sportBuckets);
    renderCards(sportBuckets);
  }

  async function loadGames() {
    const statusText = document.getElementById('statusText');
    const statusBar = document.getElementById('statusBar');
    statusText.textContent = 'Loading games.json...';
    statusBar.classList.remove('error');
    try {
      const resp = await fetch('./games.json', { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();

      const sportBuckets = data.sports || {};
      allEvents = Object.values(sportBuckets).flat();
      activeFilter = 'all';

      const genAt = data.generated_at ? formatDate(data.generated_at) : 'unknown';
      statusText.textContent = `Last updated ${genAt} · ${allEvents.length} event(s) across ${Object.keys(sportBuckets).length} sport(s)`;

      render(sportBuckets);
    } catch (e) {
      statusBar.classList.add('error');
      statusText.textContent = "Couldn't load games.json (" + e.message + "). Make sure fetch_games.py has run at least once and games.json sits next to this page.";
      document.getElementById('cardsList').innerHTML = '<div class="empty">no data loaded yet</div>';
      document.getElementById('filterRow').innerHTML = '';
    }
  }

  document.getElementById('refreshBtn').addEventListener('click', loadGames);

  loadTheme();
  loadGames();
</script>
</body>
</html>
