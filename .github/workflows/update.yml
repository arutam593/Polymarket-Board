name: Update Polymarket games

on:
  schedule:
    # Runs every day at 12:00 UTC. Edit the cron expression to change timing.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

concurrency:
  group: update-games-json
  cancel-in-progress: false   # let a running job finish rather than fighting over the push

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest games
        run: python fetch_games.py

      - name: Commit updated games.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --quiet --cached || git commit -m "Update games.json"
          git pull --rebase origin main
          git push
